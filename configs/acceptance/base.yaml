# LHCb-like acceptance emulator (d02hhhh_toys.acceptance).
# PROPOSED TOY VALUES, NOT YET CONFIRMED: to be tuned on Run 3 simulation.
# Units: GeV, µm. Other files override this one with `base: base.yaml`.
production:  # dN/dpT ∝ pT / (1 + (pT/pt_scale)^2)^pt_power, η uniform
  pt_scale: 2.5
  pt_power: 3.0
  pt_max: 30.0
  eta_min: 2.0
  eta_max: 5.0
ip_resolution:  # σ_IP = scale · (a + b/pT)
  a_um: 12.0
  b_um_gev: 24.0
  scale: 1.0
tracks:
  eta_min: 2.0
  eta_max: 5.0
  p_min: 2.0
  pt_min: 0.25
tracking:  # ε(p) = plateau · (1 − exp(−(p − threshold)/width))
  plateau: 0.97
  threshold: 1.5
  width: 1.5
offline:  # at least n_tracks daughters with IPχ² > ipchi2_min (0: no cut, 4: all four)
  n_tracks: 0
  ipchi2_min: 4.0
vertex_resolution:  # flight-distance resolution (PV and decay vertex combined), µm
  sigma_xy_um: 20.0
  sigma_z_um: 100.0
hlt1:  # one-track OR two-track line, as in data taking
  mode: any
  lines:
    - kind: one_track  # ln(IPχ²/ipchi2_floor) > k/(pT − pt_wall)
      name: one_track
      pt_wall: 1.5
      k: 2.0
      ipchi2_floor: 8.0
    - kind: two_track  # pair preselection, then a linear score > score_min
      name: two_track
      track_pt_min: 0.2
      track_ipchi2_min: 4.0
      vertex_pt_min: 1.0
      mcorr_min: 1.0
      doca_max_um: 200.0
      vertex_chi2_max: 20.0
      eta_min: 2.0
      eta_max: 5.0
      w_fd: 1.0     # × ln FDχ²
      w_pt: 0.5     # × Σ pT [GeV]
      w_ip: 0.5     # × ln min IPχ²
      w_chi2: 0.05  # × vertex χ² (subtracted)
      score_min: 7.0
ctau_um: 122.9
d0_mass: 1.86484
